name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff

      - name: Licence headers
        # A file added without an SPDX identifier fails the build rather than
        # drifting in unnoticed.
        run: python scripts/check_spdx.py

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI is wired up
        # The offline gate reachable through the published entry point, so a
        # broken CLI fails CI rather than being found by a reader.
        run: |
          implieddensity --help
          implieddensity verify
