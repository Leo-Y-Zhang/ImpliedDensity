name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff

      - name: Licence headers
        # A file added without an SPDX identifier fails the build rather than
        # drifting in unnoticed.
        run: python scripts/check_spdx.py

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI is wired up
        # The offline gate reachable through the published entry point, so a
        # broken CLI fails CI rather than being found by a reader.
        run: |
          implieddensity --help
          implieddensity verify
